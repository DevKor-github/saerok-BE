spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

server:
  port: 8080
  tomcat:
    accesslog:
      enabled: true
      # Docker 호스트의 ~/saerok/accesslogs와 연결되는 컨테이너 내부 경로
      directory: /app/accesslogs
      prefix: access_log
      suffix: .log
      rotate: true
      # OAuth 인가 코드 등이 포함될 수 있는 쿼리 문자열(%q)은 기록하지 않는다.
      pattern: '%h %t "%m %U" %s %b %D'

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off

swagger:
  server-url: https://dev-api.saerok.app

aws:
  credentials:
    access-key: ${IAM_ACCESS_KEY}
    secret-key: ${IAM_SECRET_KEY}
  region: ap-northeast-2
  s3:
    upload-image-bucket: ${UPLOAD_IMAGE_BUCKET_NAME}
    dex-image-bucket: ${DEX_IMAGE_BUCKET_NAME}
  cloudfront:
    upload-image-domain: ${UPLOAD_IMAGE_DOMAIN}
    dex-image-domain: ${DEX_IMAGE_DOMAIN}
  kms:
    key-id: ${KMS_KEY_ID}

apple:
  client-id: ${APPLE_CLIENT_ID}
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  private-key: ${APPLE_PRIVATE_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-secret: ${KAKAO_CLIENT_SECRET}
  admin-key: ${KAKAO_ADMIN_KEY}
  app-id: ${KAKAO_APP_ID}

oauth:
  kakao:
    redirect-routing:
      default-redirect-uri: ${KAKAO_REDIRECT_URI}
      channels:
        admin: ${KAKAO_REDIRECT_URI_ADMIN}

app:
  cookie:
    secure: true

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
