services:
  app:
    image: ${IMAGE_REF:-ghcr.io/devkor-github/saerok-be:dev-latest}
    container_name: saerok-dev
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8080:8080"

    # t4g.micro에서 시작 시 CPU를 탄력적으로 쓰되 메모리 사용량은 제한한다.
    cpus: "0.75"
    mem_limit: "512m"
    mem_reservation: "320m"

    env_file:
      - ${ENV_FILE:-/run/saerok/env.dev}

    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/saerok}
      JAVA_OPTS: >-
        -Duser.timezone=Asia/Seoul
        -Xms128m -Xmx256m
        -XX:MaxMetaspaceSize=160m
        -XX:MaxDirectMemorySize=32m
        -XX:ReservedCodeCacheSize=48m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
      # Redis 연결 정보
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

    volumes:
      # 컨테이너를 다시 만들어도 접근 로그가 ~/saerok/accesslogs에 남는다.
      - ./accesslogs:/app/accesslogs

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: saerok-postgres:17-postgis
    container_name: saerok-postgres-dev
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "64m"
    environment:
      POSTGRES_DB: saerok
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=ko_KR.utf8 --encoding=UTF8"
    volumes:
      # 상대 경로는 Compose 파일이 있는 ~/saerok을 기준으로 해석된다.
      - ./data/postgres:/var/lib/postgresql/data

    cpus: "0.50"
    mem_limit: "256m"
    mem_reservation: "128m"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: saerok-redis-dev
    restart: unless-stopped
    # 내부 전용: 필요 시에만 포트 노출
    # ports:
    #   - "6379:6379"
    command:
      - "redis-server"
      # --- RDB 느슨한 주기, AOF 끔 ---
      - "--save"
      - "900"
      - "1"                    # 15분 동안 1건 이상 변경 시 스냅샷
      - "--save"
      - "300"
      - "10"                   # 5분 동안 10건 이상 변경 시 스냅샷
      - "--appendonly"
      - "no"                   # AOF 비활성화
      - "--rdbcompression"
      - "yes"                  # 스냅샷 압축(기본값이지만 명시)
      - "--stop-writes-on-bgsave-error"
      - "no"                   # dev: 백업 실패로 쓰기 중단 방지
      # --- 캐시 특성: 메모리 상한과 축출 정책 ---
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    cpus: "0.25"
    mem_limit: "192m"
    mem_reservation: "64m"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
